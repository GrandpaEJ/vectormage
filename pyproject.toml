[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vectormage"
version = "0.1.0"
description = "High-quality PNG/JPG to SVG vectorizer CLI tool"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "opencv-python-headless>=4.8.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
vectormage = "vectormage.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["vectormage"]
